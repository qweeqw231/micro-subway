# Fallback path: run manually only after switching Settings -> Pages -> Source to "Deploy from a branch".
# The primary deployment is deploy-pages.yml on push to main.
name: Deploy to gh-pages branch

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build for project Pages
        run: npm run build:pages

      - name: Publish dist to gh-pages
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp -R dist /tmp/linevale-pages
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages FETCH_HEAD
          else
            git checkout --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          rm -rf dist
          cp -R /tmp/linevale-pages/. .
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Deploy ${GITHUB_SHA::7}"
            git push origin gh-pages
          fi
